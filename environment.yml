# environment.yml: conda environment for the Citi Bike member-lookalike pipeline
name: citibike_mlops
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Pipeline packages: what src/ imports to run (notebook cell 1)
  - pandas>=2.0
  - numpy
  - scikit-learn>=1.2
  - joblib
  - networkx

  # Development tools: check the code, not needed to run it
  - pytest
  - pytest-cov
  - flake8